<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Raisa Qadarina</title>
    <style>
        :root { 
            --pink: #ff85a2; 
            --pink-dark: #f6416c; 
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1, #ffe5ec);
            margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden; position: relative;
        }
        #sakura-canvas { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; pointer-events: none; 
        }
        .container { 
            position: relative; z-index: 2; width: 90%; max-width: 430px; 
        }
        .main-card {
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; padding: 35px 25px; text-align: center; 
            border: 2px solid rgba(255, 133, 162, 0.3);
            box-shadow: 0 20px 50px rgba(246, 65, 108, 0.15); 
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-10px); } 
        }
        .avatar { 
            width: 130px; height: 130px; border-radius: 50%; 
            border: 5px solid #fff; object-fit: cover; 
            box-shadow: 0 10px 25px rgba(246, 65, 108, 0.2); 
        }
        .typewriter { 
            background: #fff; color: var(--pink-dark); 
            display: inline-block; padding: 6px 18px; border-radius: 50px; 
            font-weight: 700; font-size: 13px; margin: 15px 0; 
            box-shadow: 0 5px 15px rgba(246, 65, 108, 0.08); 
        }
        h1 { color: #4a1521; margin: 0 0 5px 0; font-size: 26px; font-weight: 800; }
        .subtitle { color: #885560; font-size: 14px; margin: 0 0 25px 0; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            color: white; text-decoration: none; padding: 14px; 
            border-radius: 50px; font-weight: 700; font-size: 14px; 
            text-align: center; transition: all 0.3s ease; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        .btn:hover { transform: translateY(-3px) scale(1.02); }
    </style>
</head>
<body>

    <canvas id="sakura-canvas"></canvas>

    <div class="container">
        <div class="main-card">
            <div style="position: relative; display: inline-block;">
                <span style="position: absolute; top: -10px; right: -5px; font-size: 24px;">✨</span>
                <img src="me.jpg" alt="Foto Raisa" class="avatar">
            </div>

            <div class="typewriter" id="tw"></div>
            
            <h1>Raisa Qadarina</h1>
            <p class="subtitle">Alumni 12 TKJ | IT Student & Entrepreneur</p>

            <div class="btn-group">
                <a href="https://chat.whatsapp.com/Ku4OwUBBp3gAVztifM4EfP" target="_blank" class="btn" style="background: linear-gradient(135deg, #25D366, #128C7E);">🛍️ Store: Robux & Premium Apps</a>
                <a href="https://www.linkedin.com/in/raisa-qadarina-6118b1406" target="_blank" class="btn" style="background: linear-gradient(135deg, #0A66C2, #004182);">💼 Connect on LinkedIn</a>
                <a href="https://instagram.com" target="_blank" class="btn" style="background: linear-gradient(135deg, #fbad50, #cd486b, #4c68d7);">📸 Follow My Instagram</a>
                <button class="btn" onclick="pop()" style="background: linear-gradient(135deg, var(--pink), var(--pink-dark)); border: none; cursor: pointer;">🌸 Klik Hadiah Kejutan!</button>
            </div>
        </div>
    </div>

    <script>
        const ph = ["Halo, Selamat Datang! ✨", "Welcome to My Room 💖", "Robux & App Store Vendor 🛍️", "Aktif 24 Jam Selamanya 🚀"];
        let pi = 0, ci = 0; const el = document.getElementById("tw");
        function type() {
            if (ci < ph[pi].length) { el.textContent += ph[pi].charAt(ci); ci++; setTimeout(type, 90); } 
            else { setTimeout(erase, 2200); }
        }
        function erase() {
            if (ci > 0) { el.textContent = ph[pi].substring(0, ci - 1); ci--; setTimeout(erase, 40); } 
            else { pi = (pi + 1) % ph.length; setTimeout(type, 400); }
        }
        setTimeout(type, 400);

        const canvas = document.getElementById('sakura-canvas'); const ctx = canvas.getContext('2d'); let petals = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Petal {
            constructor() { this.reset(); this.y = Math.random() * canvas.height; }
            reset() { this.x = Math.random() * canvas.width; this.y = -20; this.size = Math.random() * 7 + 6; this.sy = Math.random() * 1.2 + 0.8; this.sx = Math.random() * 1.2 + 0.4; this.a = Math.random() * 360; this.sp = Math.random() * 1.6 - 0.8; }
            update() { this.y += this.sy; this.x += this.sx; this.a += this.sp; if (this.y > canvas.height || this.x > canvas.width) this.reset(); }
            draw() { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.a * Math.PI / 180); ctx.fillStyle = '#ffb3c6'; ctx.beginPath(); ctx.ellipse(0, 0, this.size, this.size / 1.8, 0, 0, 2 * Math.PI); ctx.fill(); ctx.restore(); }
        }
        for (let i = 0; i < 40; i++) petals.push(new Petal());
        function anim() { ctx.clearRect(0, 0, canvas.width, canvas.height); petals.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(anim); }
        anim();

        function pop() {
            for (let i = 0; i < 25; i++) { let b = new Petal(); b.x = window.innerWidth / 2 + (Math.random() * 160 - 80); b.y = window.innerHeight / 2 + (Math.random() * 160 - 80); b.sy = Math.random() * 6 - 3; b.sx = Math.random() * 6 - 3; petals.push(b); }
            alert("Yeay! 🌸 Kamu berhasil memicu ledakan kelopak bunga sakura di layar!");
        }
    </script>
</body>
</html>
