<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio & Aplikasi TKJ - Raisa Qadarina</title>
    <style>
        :root {
            --primary-pink: #ff748c;
            --secondary-pink: #ffa3b1;
            --bg-pink: #ffeef1;
            --card-pink: #ffffff;
            --text-dark: #662230;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-pink);
            background-image: radial-gradient(var(--secondary-pink) 1px, transparent 0);
            background-size: 24px 24px;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        /* Background Efek Bunga Sakura Mengambang */
        .decorations {
            position: fixed; width: 100%; height: 100%; pointer-events: none; z-index: -1;
        }
        .flower { position: absolute; color: var(--primary-pink); opacity: 0.4; font-size: 20px; }

        .container {
            max-width: 650px;
            width: 90%;
            margin: 40px 0;
        }

        /* Card Utama Biodata */
        .bio-card {
            background: var(--card-pink);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(255, 116, 140, 0.15);
            border: 2px solid rgba(255, 163, 177, 0.3);
            margin-bottom: 25px;
            position: relative;
        }
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(255, 116, 140, 0.2);
            object-fit: cover;
            margin-bottom: 15px;
        }
        h1 { color: #cc435c; margin: 10px 0 5px 0; font-size: 28px; }
        .welcome-title {
            background: var(--bg-pink);
            color: #cc435c;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 15px;
            font-weight: bold;
            margin: 15px 0;
            font-size: 18px;
        }
        .tag-container {
            display: flex; justify-content: center; gap: 10px; margin-top: 15px;
        }
        .tag {
            background: var(--primary-pink); color: white; padding: 6px 15px;
            border-radius: 20px; font-size: 13px; font-weight: bold;
        }

        /* Card Form dan Tabel CRUD */
        .crud-card {
            background: var(--card-pink); border-radius: 24px; padding: 25px;
            box-shadow: 0 10px 25px rgba(255, 116, 140, 0.1);
            border: 2px solid rgba(255, 163, 177, 0.2);
        }
        h2 { color: #cc435c; margin-top: 0; text-align: center; font-size: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input, textarea {
            width: 100%; padding: 12px; border: 1.5px solid #ffd0d7;
            border-radius: 12px; box-sizing: border-box; font-family: inherit;
            background-color: #fffbfb; color: var(--text-dark);
        }
        input:focus, textarea:focus { border-color: var(--primary-pink); outline: none; }
        button {
            background: linear-gradient(135deg, var(--primary-pink), #ff5370);
            color: white; border: none; padding: 12px 25px; border-radius: 12px;
            cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 5px 10px rgba(255, 116, 140, 0.2);
        }
        button:hover { opacity: 0.9; }

        /* Tabel Pengganti PHP */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ffeef1; }
        th { background-color: #fff5f6; color: #cc435c; font-weight: bold; }
        .btn-edit { background: #f59e0b; padding: 5px 10px; font-size: 12px; width: auto; display: inline-block; margin-right: 3px;}
        .btn-danger { background: #ef4444; padding: 5px 10px; font-size: 12px; width: auto; display: inline-block; }
    </style>
</head>
<body>

    <!-- Taburan Bunga Hiasan -->
    <div class="decorations">
        <div class="flower" style="top: 15%; left: 10%;">🌸</div>
        <div class="flower" style="top: 25%; right: 12%;">💮</div>
        <div class="flower" style="top: 70%; left: 8%;">✨</div>
        <div class="flower" style="top: 60%; right: 15%;">🌸</div>
    </div>

    <div class="container">
        <!-- Tampilan Atas Mirip Gambar Pink Kamu -->
        <div class="bio-card">
            <span>🌸 🌸 💮 🌸</span>
            <!-- Membaca me.png kamu. Jika me.png belum ter-upload, otomatis pakai foto kucing lucu -->
            <img src="me.png" alt="Foto Raisa" class="avatar" onerror="this.src='https://placekitten.com';">
            
            <div class="welcome-title">Selamat Datang di Website Saya!</div>
            <h1>Raisa Qadarina</h1>
            <p style="margin: 5px 0; font-weight: 500;">Kelas 12 TKJ</p>
            <p style="font-size: 13px; color: #885560; font-style: italic;">Berhasil dikonfigurasi pada server GitHub Pages.</p>
            
            <div class="tag-container">
                <div class="tag">🚀 TKJ 2026</div>
                <div class="tag">🎯 CyberPanel</div>
            </div>
        </div>

        <!-- Bagian Aplikasi Interaktif CRUD -->
        <div class="crud-card">
            <h2>Aplikasi CRUD Data Siswa (Interaktif)</h2>
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="form-group">
                    <label>Nama:</label>
                    <input type="text" id="nama" required placeholder="Masukkan nama kamu">
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" required placeholder="raisa@email.com">
                </div>
                <div class="form-group">
                    <label>Komentar:</label>
                    <textarea id="komentar" rows="3" required placeholder="Tulis komentar praktikum..."></textarea>
                </div>
                <button type="submit" id="btnSubmit">💖 Simpan Data</button>
            </form>

            <h3 style="margin-top: 25px; color: #cc435c; font-size: 16px;">✨ Data Siswa Terpajang:</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>Komentar</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Sistem Logika Data Interaktif LocalStorage -->
    <script>
        let students = JSON.parse(localStorage.getItem('siswa_data')) || [
            {id: 1, nama: 'Raisa Qadarina', email: 'raisa@tkj.net', komentar: 'Tugas CRUD dan CyberPanel selesai!'},
            {id: 2, nama: 'Budi Hartono', email: 'budi@tkj.net', komentar: 'Desain website barunya estetik banget.'}
        ];

        const form = document.getElementById('studentForm');
        const tableBody = document.getElementById('studentTableBody');
        const submitBtn = document.getElementById('btnSubmit');

        function renderTable() {
            tableBody.innerHTML = '';
            students.forEach((student) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${student.nama}</strong></td>
                    <td>${student.email}</td>
                    <td>${student.komentar}</td>
                    <td>
                        <button class="btn-edit" onclick="editData(${student.id})">Edit</button>
                        <button class="btn-danger" onclick="deleteData(${student.id})">Hapus</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
            localStorage.setItem('siswa_data', JSON.stringify(students));
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('studentId').value;
            const nama = document.getElementById('nama').value;
            const email = document.getElementById('email').value;
            const komentar = document.getElementById('komentar').value;

            if (id) {
                students = students.map(s => s.id == id ? {id: parseInt(id), nama, email, komentar} : s);
                submitBtn.innerText = '💖 Simpan Data';
            } else {
                const newStudent = { id: Date.now(), nama, email, komentar };
                students.unshift(newStudent);
            }
            form.reset();
            document.getElementById('studentId').value = '';
            renderTable();
        });

        window.deleteData = function(id) {
            if(confirm('Yakin hapus data ini?')) {
                students = students.filter(s => s.id !== id);
                renderTable();
            }
        }

        window.editData = function(id) {
            const student = students.find(s => s.id === id);
            if(student) {
                document.getElementById('studentId').value = student.id;
                document.getElementById('nama').value = student.nama;
                document.getElementById('email').value = student.email;
                document.getElementById('komentar').value = student.komentar;
                submitBtn.innerText = '✨ Update Data';
