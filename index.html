<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio - Raisa Qadarina</title>
    <style>
        :root {
            --pink-light: #fff0f3;
            --pink-main: #ff85a2;
            --pink-dark: #f6416c;
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 133, 162, 0.3);
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1, #ffe5ec);
            background-size: 400% 400%;
            animation: gradientBg 12s ease infinite;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Canvas Latar Belakang Hujan Sakura */
        #sakura-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 450px;
        }

        /* Kartu Profil Utama (Glassmorphism) */
        .main-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 35px;
            padding: 45px 30px;
            text-align: center;
            border: 2px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(246, 65, 108, 0.15);
            animation: cardFloat 4s ease-in-out infinite, fadeInUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: transform 0.3s ease;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Bingkai Foto Profil Utama */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 25px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #fff;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(246, 65, 108, 0.2);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar:hover {
            transform: scale(1.08) rotate(5deg);
        }

        .sparkle-decor {
            position: absolute;
            font-size: 24px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* Teks Berjalan / Mengetik Otomatis */
        .typewriter-badge {
            background: #fff;
            color: var(--pink-dark);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            box-shadow: 0 5px 15px rgba(246, 65, 108, 0.08);
            margin-bottom: 15px;
            min-height: 20px;
        }

        h1 {
            color: #4a1521;
            margin: 0 0 8px 0;
            font-size: 30px;
            font-weight: 800;
        }

        .subtitle {
            color: #885560;
            font-size: 15px;
            margin: 0 0 35px 0;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Tombol-Tombol Aksi Interaktif */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--pink-main), var(--pink-dark));
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 8px 20px rgba(246, 65, 108, 0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .action-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 30px rgba(246, 65, 108, 0.4);
            background: linear-gradient(135deg, var(--pink-dark), var(--pink-main));
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .footer-credit {
            font-size: 11px;
            color: #b08890;
            margin-top: 35px;
            letter-spacing: 0.5px;
        }
    </style>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Area Animasi Hujan Kelopak Bunga Sakura -->
    <canvas id="sakura-canvas"></canvas>

    <div class="container">
        <div class="main-card">
            
            <div class="avatar-container">
                <div class="sparkle-decor" style="top: -10px; right: -5px;">✨</div>
                <div class="sparkle-decor" style="bottom: -5px; left: -10px;">🌸</div>
                <!-- Menghubungkan otomatis ke file me.jpg kamu -->
                <img src="me.jpg" alt="Foto Raisa" class="avatar">
            </div>

            <!-- Tempat teks mengetik otomatis muncul -->
            <div class="typewriter-badge" id="typewriter"></div>
            
            <h1>Raisa Qadarina</h1>
            <p class="subtitle">Alumni 12 TKJ | Creative Cloud Showcase</p>

            <!-- Tombol Interaktif Baru Tanpa Formulir Kaku -->
            <div class="button-group">
                <button class="action-btn" onclick="popSurprise()">🌸 Klik Hadiah Kejutan!</button>
                <a href="https://github.com" target="_blank" class="action-btn" style="background: #4a1521; box-shadow: 0 8px 20px rgba(74, 21, 33, 0.25);">✨ Kunjungi GitHub Saya</a>
            </div>

            <p class="footer-credit">Hosted via GitHub Pages • Crafted with 💖</p>
            
        </div>
    </div>

    <script>
        // --- 1. SCRIPT EFEK KETIK OTOMATIS (TYPEWRITER) ---
        const phrases = ["Halo, Selamat Datang! ✨", "Welcome to My Sweet Room 💖", "Web Portofolio Kreatif", "Aktif 24 Jam Selamanya 🚀"];
        let phraseIndex = 0;
        let charIndex = 0;
        const targetElement = document.getElementById("typewriter");

        function typeEffect() {
            if (charIndex < phrases[phraseIndex].length) {
                targetElement.textContent += phrases[phraseIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeEffect, 90);
            } else {
                setTimeout(eraseEffect, 2200);
            }
        }

        function eraseEffect() {
            if (charIndex > 0) {
                targetElement.textContent = phrases[phraseIndex].substring(0, charIndex - 1);
                charIndex--;
                setTimeout(eraseEffect, 40);
            } else {
                phraseIndex = (phraseIndex + 1) % phrases.length;
                setTimeout(typeEffect, 400);
            }
        }
        document.addEventListener("DOMContentLoaded", () => setTimeout(typeEffect, 400));


        // --- 2. SCRIPT HUJAN SAKURA REALTIME (CANVAS) ---
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');
        let petals = [];

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', setCanvasSize);
        setCanvasSize();

        class SakuraPetal {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; // Sebaran awal merata di layar
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 7 + 6;
                this.speedX = Math.random() * 1.2 + 0.4;
                this.speedY = Math.random() * 1.2 + 0.8;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 1.6 - 0.8;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += this.spin;
                if (this.y > canvas.height || this.x > canvas.width) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                ctx.fillStyle = '#ffb3c6';
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 1.8, 0, 0, 2 * Math.PI);
                ctx.fill();
                ctx.restore();
            }
        }

        // Membuat 40 kelopak bunga sakura di background
        for (let i = 0; i < 40; i++) {
            petals.push(new SakuraPetal());
        }

        function runAnimation() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(petal => {
                petal.update();
                petal.draw();
            });
            requestAnimationFrame(runAnimation);
        // --- 3. LOGIKA INTERAKSI TOMBOL KEJUTAN ---
        function popSurprise() {
            for (let i = 0; i < 20; i++) {
                let burst = new SakuraPetal();
                burst.x = window.innerWidth / 2 + (Math.random() * 160 - 80);
                burst.y = window.innerHeight / 2 + (Math.random() * 160 - 80);
                burst.speedY = Math.random() * 6 - 3;
                burst.speedX = Math.random() * 6 - 3;
                petals.push(burst);
            }
            alert("Yeay! 🌸 Kamu berhasil memicu ledakan kelopak bunga sakura di layar!");
        }
    </script>
</body>
</html>
